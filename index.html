<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>같이 보는 방</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2b2452">
<script>
  // 3D 방은 데스크톱 앱 전용. 브라우저로 열면 예전 2D 화면으로 보낸다.
  if (!/\bElectron\//.test(navigator.userAgent)) location.replace('classic.html');
</script>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js", "three/addons/": "./node_modules/three/examples/jsm/" } }

<style>
:root{--font-display:'Jua','Malgun Gothic',system-ui,sans-serif;--font-body:'Gowun Dodum','Malgun Gothic',system-ui,sans-serif;--cream:#fff3dc;--ink:#1c1730;--lamp:#ffc66b}
@font-face{font-family:'Jua';src:local('Jua')}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1c1730;color:var(--cream);font-family:var(--font-body)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}

/* 노트북 화면: 3D 화면 사각형에 딱 맞게 기울여 붙는 진짜 브라우저 */
#screenWrap{position:fixed;left:0;top:0;width:1366px;height:808px;transform-origin:0 0;background:#0f0f0f;overflow:hidden;will-change:transform;cursor:none}
#bar{height:40px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#17161f;border-bottom:1px solid #2c2b38}
#bar .dots{display:flex;gap:6px}
#bar .dots i{width:11px;height:11px;border-radius:50%;background:#ff6b6b}
#bar .dots i:nth-child(2){background:#ffd166}#bar .dots i:nth-child(3){background:#6bd68a}
#bar button{height:30px;min-width:30px;border-radius:15px;border:0;background:none;color:#cfcbe0;display:grid;place-items:center;padding:0;cursor:none}
#bar button:hover{background:#34323f;color:#fff}
#bar svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#urlForm{flex:1;display:flex;gap:8px}
#urlInput{flex:1;height:30px;border-radius:15px;border:1px solid #403e52;background:#25232f;color:#f4f0e6;padding:0 14px;font-size:15px;cursor:none}
#goBtn{padding:0 16px!important;background:#ff4e45!important;color:#fff!important;font-family:var(--font-display);font-size:15px}
#screenWrap webview{display:flex;width:1366px;height:768px}
#cursor{position:absolute;left:0;top:0;width:22px;height:22px;pointer-events:none;z-index:5;display:none;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.6))}
#cursor svg{position:absolute;left:0;top:0;width:22px;height:22px}
#cursor .c-pointer,#cursor .c-text{display:none}
#cursor[data-k=pointer] .c-default,#cursor[data-k=text] .c-default{display:none}
#cursor[data-k=pointer] .c-pointer{display:block;left:-6px}
#cursor[data-k=text] .c-text{display:block;left:-11px;top:-11px}

/* 화면 위 표시들 */
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 16px;z-index:10;pointer-events:none}
.hud>*{pointer-events:auto}
.brand{font-family:var(--font-display);font-size:23px;margin:0 auto 0 0;font-weight:400;text-shadow:0 2px 8px rgba(0,0,0,.5)}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;font-size:14px;white-space:nowrap;background:rgba(22,17,44,.62);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.chip b{font-family:var(--font-display);font-weight:400;font-size:15px;font-variant-numeric:tabular-nums}
.status{max-width:min(38vw,380px)}.status span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:#8a86a3}
[data-phase=playing] .dot{background:#ff5d6c}[data-phase=paused] .dot{background:var(--lamp)}
button.chip:hover{background:rgba(52,42,92,.85)}
.controls{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:8px 16px 14px;z-index:10;pointer-events:none}
.controls>*{pointer-events:auto}
.reacts{display:flex;gap:8px}
.react{width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.14);background:rgba(22,17,44,.62);font-size:22px;line-height:1;padding:0;backdrop-filter:blur(8px);transition:transform .12s}
.react:hover{transform:translateY(-3px);background:rgba(70,56,120,.85)}
.chat{display:flex;gap:8px;flex:0 1 360px}
.chat input{flex:1;min-width:0;height:46px;border-radius:999px;padding:0 18px;border:1px solid rgba(255,255,255,.16);background:rgba(22,17,44,.66);backdrop-filter:blur(8px)}
.chat button{height:46px;padding:0 20px;border-radius:999px;border:0;background:var(--lamp);color:#3a2408;font-family:var(--font-display);font-size:17px}
.hintline{position:fixed;left:16px;bottom:16px;z-index:10;font-size:13px;opacity:.75;pointer-events:none;text-shadow:0 1px 4px #000}

.tag,.bubble{position:fixed;left:0;top:0;z-index:8;pointer-events:none;will-change:transform}
.tag{height:25px;padding:0 11px;border-radius:999px;background:rgba(22,17,44,.78);border:1px solid rgba(255,255,255,.14);font-family:var(--font-display);font-size:14.5px;display:flex;align-items:center;white-space:nowrap}
.tag.on{border-color:var(--lamp);color:var(--lamp)}
.bubble{max-width:230px;width:max-content;padding:8px 12px;border-radius:16px;background:var(--cream);color:var(--ink);font-size:14.5px;line-height:1.35;word-break:keep-all;box-shadow:0 8px 18px rgba(0,0,0,.32);opacity:0;transition:opacity .2s}
.bubble.show{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.float{position:absolute;font-size:30px;line-height:1}
#subtitle{position:fixed;left:50%;bottom:86px;translate:-50% 0;z-index:9;max-width:min(80vw,720px);padding:9px 18px;border-radius:10px;background:rgba(10,12,20,.62);font-size:20px;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
#subtitle.show{opacity:1}
.toast{position:fixed;left:50%;top:60px;translate:-50% 0;z-index:60;padding:10px 18px;border-radius:14px;background:rgba(18,14,36,.94);border:1px solid rgba(255,255,255,.16);font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
</style>
</head>
<body data-phase="idle">
<canvas id="gl"></canvas>

<div id="screenWrap">
  <div id="bar">
    <div class="dots"><i></i><i></i><i></i></div>
    <button type="button" id="navBack" title="뒤로"><svg viewBox="0 0 16 16"><path d="M10 3 5 8l5 5"/></svg></button>
    <button type="button" id="navFwd" title="앞으로"><svg viewBox="0 0 16 16"><path d="m6 3 5 5-5 5"/></svg></button>
    <button type="button" id="navReload" title="새로고침"><svg viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v2.4h-2.4"/></svg></button>
    <button type="button" id="navHome" title="유튜브 홈"><svg viewBox="0 0 16 16"><path d="M2.5 7.5 8 3l5.5 4.5V13h-3.6V9.5H6.1V13H2.5z"/></svg></button>
    <form id="urlForm" autocomplete="off">
      <input id="urlInput" type="text" placeholder="유튜브 검색 또는 주소 입력" aria-label="유튜브 검색 또는 주소" spellcheck="false">
      <button type="submit" id="goBtn">이동</button>
    </form>
  </div>
  <div id="cursor" data-k="default">
    <svg class="c-default" viewBox="0 0 22 22"><path d="M3 2v15l4.2-3.6 2.7 6 2.4-1.1-2.7-5.9H15z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>
    <svg class="c-pointer" viewBox="0 0 22 22"><path d="M8 2.5c1 0 1.7.7 1.7 1.7v5l5.6 1c1.3.2 2.2 1.4 2 2.7l-.7 4.6c-.2 1.2-1.2 2-2.4 2H9.6c-.8 0-1.5-.4-2-1L3.8 13c-.6-.8-.3-1.9.6-2.3.6-.3 1.3-.1 1.8.4l.1.1v-7c0-1 .7-1.7 1.7-1.7z" fill="#fff" stroke="#111" stroke-width="1.2" stroke-linejoin="round"/></svg>
    <svg class="c-text" viewBox="0 0 22 22"><path d="M8 3h2.2c.5 0 .8.3.8.8.1-.5.4-.8.9-.8H14M8 19h2.2c.5 0 .8-.3.8-.8.1.5.4.8.9.8H14M11 4v14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M8 3h2.2c.5 0 .8.3.8.8.1-.5.4-.8.9-.8H14M8 19h2.2c.5 0 .8-.3.8-.8.1.5.4.8.9.8H14M11 4v14" fill="none" stroke="#111" stroke-width="1.3" stroke-linecap="round"/></svg>
  </div>
</div>

<header class="hud">
  <h1 class="brand">같이 보는 방</h1>
  <div class="chip status"><span class="dot"></span><span id="statusText">대기 중</span></div>
  <div class="chip">함께 본 시간 <b id="watchTime">00:00</b></div>
  <button class="chip" id="themeBtn" type="button" title="그림체를 기본으로 되돌리기">그림체 · <b id="themeName">아늑한 방</b></button>
</header>
<footer class="controls">
  <div class="reacts" id="reacts"></div>
  <form class="chat" id="chatForm" autocomplete="off">
    <input id="chatInput" type="text" maxlength="60" placeholder="친구들에게 한마디">
    <button type="submit">말하기</button>
  </form>
</footer>
<div class="hintline">친구를 클릭하면 그 친구의 세계로 바뀌어요 · 휠: 가까이/멀리</div>
<div id="labels"></div>
<div id="subtitle"></div>
<div id="fx"></div>
<div class="toast" id="toast"></div>

<script type="module" src="src/app.js"></script>
</body>
</html>
