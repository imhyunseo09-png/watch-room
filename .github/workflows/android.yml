# 안드로이드 앱(apk)을 만들어 'Releases'에 올린다 (main에 올릴 때마다 자동)
# 받는 주소: https://github.com/imhyunseo09-png/watch-room/releases/latest/download/watch-room.apk
name: 안드로이드 앱 만들기
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: three.js 받기
        run: npm ci --omit=dev --ignore-scripts
      - name: 게임 파일을 앱 안에 넣기
        run: |
          W=android/app/src/main/assets/www
          mkdir -p $W/node_modules/three
          cp -r index.html manifest.webmanifest src assets icons $W/
          cp -r node_modules/three/build node_modules/three/examples $W/node_modules/three/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: apk 만들기
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: 이름 붙이기
        run: cp android/app/build/outputs/apk/release/app-release.apk watch-room.apk
      - name: Releases에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app
          name: 같이 보는 방 (안드로이드)
          body: 폰에서 watch-room.apk 를 눌러 받고 설치하세요. 새 버전은 지우지 않고 그대로 덮어 설치하면 돼요.
          files: watch-room.apk
          make_latest: true
